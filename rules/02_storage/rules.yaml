category: "MASVS-STORAGE: Data Storage Testing"
tab_index: 2
rules:
  - id: "AND-STOR-01"
    name: "Sensitive Data in SharedPreferences"
    execution_mode: "Automated_Dynamic"
    severity: "High"
    target_path: "/shared_prefs"
    check_type: "xml_leak_scan"
    description: "Search SharedPreferences XML files for plaintext tokens, credentials, or PII."

  - id: "AND-STOR-02"
    name: "Unencrypted Local Databases"
    execution_mode: "Automated_Dynamic"
    severity: "High"
    target_path: "/databases"
    check_type: "sqlite_header_scan"
    description: "Audit SQLite/Room databases for plaintext schemas and SQLCipher encryption headers."

  - id: "AND-STOR-03"
    name: "Keystore Access Controls"
    execution_mode: "Automated_Static"
    severity: "Medium"
    check_type: "dex_call"
    target_pattern: "Ljava/security/KeyStore;->getInstance"
    description: "Verify that cryptographic keys use AndroidKeyStore provider with appropriate auth flags."

  - id: "AND-STOR-04"
    name: "Sensitive Data in System Logs"
    execution_mode: "Automated_Dynamic"
    severity: "Medium"
    check_type: "logcat_regex_stream"
    description: "Analyze live logcat output for authentication tokens, passwords, and sensitive parameters."

  - id: "AND-STOR-05"
    name: "Android Backup Exposure"
    execution_mode: "Automated_Static"
    severity: "Medium"
    check_type: "backup_rules_eval"
    description: "Verify backup exclusion rules for sensitive directories."

  - id: "AND-STOR-08"
    name: "Screen Caching / Recent Tasks Exposure"
    execution_mode: "Automated_Static"
    severity: "Low"
    check_type: "dex_call"
    target_pattern: "FLAG_SECURE"
    description: "Verify that activities handling sensitive information set FLAG_SECURE to prevent task switcher caching."