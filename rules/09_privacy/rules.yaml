category: "MASVS-PRIVACY: Privacy Testing"
tab_index: 9
rules:
  - id: "AND-PRIV-01"
    name: "Excessive or Undisclosed Dangerous Permissions"
    execution_mode: "Automated_Static"
    severity: "Medium"
    description: "Enumerate requested permissions that fall into privacy-sensitive categories (Location, Contacts, Microphone, Camera, Storage)."
    check_type: "manifest_permission_audit"
    sensitive_permissions:
      - "android.permission.ACCESS_FINE_LOCATION"
      - "android.permission.ACCESS_COARSE_LOCATION"
      - "android.permission.ACCESS_BACKGROUND_LOCATION"
      - "android.permission.READ_CONTACTS"
      - "android.permission.READ_CALL_LOG"
      - "android.permission.READ_SMS"
      - "android.permission.RECORD_AUDIO"
      - "android.permission.CAMERA"
      - "android.permission.READ_PHONE_STATE"

  - id: "AND-PRIV-02"
    name: "Embedded Analytics & Tracking SDKs"
    execution_mode: "Automated_Static"
    severity: "Low"
    description: "Scan classes.dex for known analytics, attribution, and advertising tracker packages."
    check_type: "package_inventory_match"

  - id: "AND-PRIV-03"
    name: "Android Advertising ID (AAID) Declaration and Access"
    execution_mode: "Automated_Static"
    severity: "Medium"
    description: "Verify AD_ID permission declaration and ensure AdvertisingIdClient is used instead of hardware serials."
    check_type: "aaid_usage_audit"
    required_permission: "com.google.android.gms.permission.AD_ID"
    target_api: "Lcom/google/android/gms/ads/identifier/AdvertisingIdClient;->getAdvertisingIdInfo"

  - id: "AND-PRIV-04"
    name: "Background Location Access & Polling Frequencies"
    execution_mode: "Automated_Static"
    severity: "High"
    description: "Audit usage of ACCESS_BACKGROUND_LOCATION and high-frequency location update requests."
    check_type: "dex_pattern_match"
    target_apis:
      - "Lcom/google/android/gms/location/LocationRequest;->setInterval"
      - "Landroid/location/LocationManager;->requestLocationUpdates"